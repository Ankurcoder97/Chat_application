version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: nexus_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexus_chat
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: nexus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/nexus_chat
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=nexus_access_secret_super_secure_key_123!
      - JWT_REFRESH_SECRET=nexus_refresh_secret_super_secure_key_456!
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
